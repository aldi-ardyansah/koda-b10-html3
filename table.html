<!DOCTYPE html>
<html lang="en">
<head>

            <a class="btn-table" href="index.html" type="button">Kembali</a>

                    <tr>
                        <th>Gudang Garam Filter</th>
                        <th>Lucky Strike</th>

                <tbody>

                </tbody>

            <br>

        </div>
    </main>
    <script src="index.js"></script>
