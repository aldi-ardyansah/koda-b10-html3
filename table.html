<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Perokok dan Non-Perokok</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-violet-50">
    <main class="flex flex-col justify-center items-center gap-2 m-4">
        <div class="flex flex-col gap-4 bg-white p-10 w-full">
            <div>
                <a class="bg-indigo-700 text-white p-2 rounded-md" href="index.html" type="button">Kembali</a>
            </div>
            <table class="border-collapse border border-black" id="tableData">
                <thead>
                    <tr>
                        <th class="border p-2" rowspan="2">No.</th>
                        <th class="border p-2" rowspan="2">Nama</th>
                        <th class="border p-2" rowspan="2">Umur</th>
                        <th class="border p-2" rowspan="2">Jenis Kelamin</th>
                        <th class="border p-2" rowspan="2">Perokok?</th>
                        <th class="border p-2" colspan="4">Jenis Rokok</th>
                    </tr>
                    <tr>
                        <th class="border p-2">Gudang Garam Filter</th>
                        <th class="border p-2">Lucky Strike</th>
                        <th class="border p-2">Marlboro</th>
                        <th class="border p-2">Esse</th>
                    </tr>
                </thead>
                <tbody class="text-center">

                </tbody>
            </table>
            <div class="flex">
                <button class="bg-indigo-700 text-white p-2 rounded-md ml-auto" type="button" id="buttonRemove">Hapus Semua Data</button>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
